[project]
name = "xwechat"
version = "1.2.0"
description = "xwechat - local WeChat data browsing, export and interaction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "typing-extensions>=4.8.0",
    "pywin32>=310; sys_platform == 'win32'",
    "uiautomation==2.0.29; sys_platform == 'win32'",
    "psutil>=7.0.0",
    "pycryptodome>=3.23.0",
    "requests>=2.32.4",
    "zstandard>=0.23.0",
    "pilk>=0.2.4",
    "pypinyin>=0.53.0",
    "jieba>=0.42.1",
    "pefile>=2024.8.26; sys_platform == 'win32'",
    "pymem>=1.14.0; sys_platform == 'win32'",
    "yara-python>=4.5.2; sys_platform == 'win32'",
    "packaging",
    "httpx",
    "watchfiles>=1.1.0",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "Pillow>=10.0",
    "huggingface-hub==1.27.0",
    "onnxruntime==1.28.0",
    "tokenizers==0.23.1",
    "sqlite-vec==0.1.9",
    "deepagents==0.7.13",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]
voice-transcription = [
    "faster-whisper>=1.1.0",
    "opencc-python-reimplemented>=0.1.7",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8; sys_platform == 'win32'",
]
# GPU 运行组件单独安装，CPU 安装包不引入 PyTorch。
voice-transcription-gpu = [
    "torch==2.9.1",
    "transformers==5.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wechat-decrypt = "wechat_decrypt_tool.backend_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Exclude binaries other than the local WXGF decoder.
# The local WXGF decoder is the sole binary explicitly included per target.
exclude = [
    "src/wechat_decrypt_tool/native/*.dll",
    "src/wechat_decrypt_tool/native/*.pyd",
    "src/wechat_decrypt_tool/native/*.exe",
    "src/wechat_decrypt_tool/native/*.so",
    "src/wechat_decrypt_tool/native/*.dylib",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_decrypt_tool"]

[tool.hatch.build.targets.wheel.force-include]
"src/wechat_decrypt_tool/native/VoipEngine.dll" = "wechat_decrypt_tool/native/VoipEngine.dll"

[tool.hatch.build.targets.sdist]
only-include = ["src/wechat_decrypt_tool", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.sdist.force-include]
"src/wechat_decrypt_tool/native/VoipEngine.dll" = "src/wechat_decrypt_tool/native/VoipEngine.dll"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 pytest 命令与 python -m pytest 都能导入仓库工具和源码。
pythonpath = [".", "src"]
