name: AI Cross-Platform Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ai-cross-platform.yml'
      - 'src/wechat_decrypt_tool/ai/**'
      - 'src/wechat_decrypt_tool/local_search/**'
      - 'src/wechat_decrypt_tool/routers/ai*.py'
      - 'src/wechat_decrypt_tool/routers/local_search.py'
      - 'src/wechat_decrypt_tool/resources/local_search*.json'
      - 'desktop/src/ai-notifications.cjs'
      - 'desktop/src/renderer-startup.cjs'
      - 'desktop/src/main.cjs'
      - 'desktop/tests/ai-*.test.cjs'
      - 'desktop/tests/renderer-startup.test.cjs'
      - 'tools/verify_ai_runtime.py'
      - 'frontend/components/**'
      - 'frontend/composables/useAiApi.js'
      - 'frontend/composables/useApi.js'
      - 'frontend/composables/chat/useChatSearch.js'
      - 'frontend/tests/chat-calendar.test.js'
      - 'src/wechat_decrypt_tool/chat_realtime_reader.py'
      - 'src/wechat_decrypt_tool/routers/chat.py'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  ai:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Use uv-managed CPython with SQLite loadable-extension support.
      UV_MANAGED_PYTHON: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: python -m pip install uv
      # Use a uv-managed Python interpreter with SQLite extension support.
      - name: Install Python with SQLite extension support
        run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --managed-python
      - name: AI runtime and media (synthetic, no API calls)
        run: uv run python tools/verify_ai_runtime.py
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npm run generate
        working-directory: frontend
      - name: Desktop notification and startup contracts
        run: node --test desktop/tests/ai-notifications.test.cjs desktop/tests/renderer-startup.test.cjs
