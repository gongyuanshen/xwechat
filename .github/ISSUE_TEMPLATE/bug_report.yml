name: Bug report
description: Report a reproducible problem with complete logs from the affected period
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Upload complete logs covering at least one minute before and after the problem, rather than only the last error line.

        For a new installation, the default log is located under the system application-data directory at `xwechat/output/logs/YYYY/MM/DD/DD_wechat_tool.log`.
        Upgrades and source development reuse the existing data directory. In the app, use Settings > Desktop behavior > Log file > Open log to find the actual path.

        Remove database keys, chat content, and other sensitive information before uploading. Do not upload WeChat databases.

  - type: input
    id: version
    attributes:
      label: Application version or source commit hash
      description: For installed or portable builds, provide the application version. For source runs, provide the full 40-character hash from `git rev-parse HEAD`.
      placeholder: v1.4.0 / full 40-character source commit hash
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      description: Provide the operating-system version and architecture.
      placeholder: Windows 11 24H2 x64 / macOS 26.4 arm64
    validations:
      required: true

  - type: input
    id: wechat_version
    attributes:
      label: WeChat version
      placeholder: 4.0.6
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected feature
      options:
        - Dependency setup or startup
        - WeChat and account detection
        - Key extraction or database decryption
        - Chat records
        - Images, videos, or voice messages
        - Import or export
        - Other
    validations:
      required: true

  - type: input
    id: occurred_at
    attributes:
      label: Time of occurrence
      description: Include the date, exact time, and time zone so the event can be located in the logs.
      placeholder: 2026-08-26 16:30 (UTC+8)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe the action you performed and the problem it caused.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps in the order you performed them.
      placeholder: |
        1. Open...
        2. Select...
        3. Click...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste the complete error message rather than only writing "failed".
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Complete logs
      description: Drag the relevant `.log` files here. Logs are required; do not upload databases or keys.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Optional. Mask accounts, paths, and chat content first.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I uploaded complete logs from the affected period.
          required: true
        - label: I did not upload databases, keys, or unredacted chat content.
          required: true
